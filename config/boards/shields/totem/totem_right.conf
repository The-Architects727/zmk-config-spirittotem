# Battery ADC reporting (uses the xiao_ble//zmk board's built-in voltage-divider
# sensor). CONFIG_ZMK_BATTERY_REPORTING is on by default, but is spelled out
# here for clarity. Shortened well below the 60s default: left/right each run
# their own independent, unsynchronized report timer, and the dongle's
# disconnect detection (src/battery_led.c) is only as tight as that interval -
# a shorter interval means less possible skew between when each side's LED
# reports "asleep".
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10

# ZMK's own idle-activity timer (unrelated to CONFIG_ZMK_SLEEP, which stays
# off) stops battery reporting entirely after 30s of no keypresses - see
# activity.c/battery.c's k_timer_stop() on ZMK_ACTIVITY_IDLE, meant for
# things like OLED shutoff that this build doesn't have. It has no other
# effect here (no OLED/backlight/underglow), so its only visible symptom is
# fooling src/battery_led.c's report-freshness heuristic into declaring the
# half "disconnected" every time you pause typing for half a minute - the
# LED then snaps back the instant you press a key, since reporting resumes
# with K_NO_WAIT right on that keypress. Set far past any realistic session
# so it never fires in practice; the LED should only go off for a real
# disconnect, sleep (manual combo or the 5-minute dongle-unreachable
# timeout - see src/totem_sleep.c), or the physical power switch.
CONFIG_ZMK_IDLE_TIMEOUT=604800000

# Manual sleep via the combo in totem.keymap (see &soft_off). Independent of
# CONFIG_ZMK_SLEEP (idle-timeout auto-sleep), which stays off - this only
# happens when you deliberately trigger it.
CONFIG_ZMK_PM_SOFT_OFF=y
