CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

# Required for the dongle to receive peripheral battery updates at all
# (zmk_peripheral_battery_state_changed is only raised when this is on).
# The battery_led module (see /Kconfig, /src/battery_led.c) depends on it.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

