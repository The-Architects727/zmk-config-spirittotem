# Battery ADC reporting (uses the xiao_ble//zmk board's built-in voltage-divider
# sensor). CONFIG_ZMK_BATTERY_REPORTING is on by default, but is spelled out
# here for clarity. The interval is shortened from the 60s default so the
# dongle's low-battery LED updates quickly after a charge/discharge.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
