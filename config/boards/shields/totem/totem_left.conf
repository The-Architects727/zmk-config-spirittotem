# Battery ADC reporting (uses the xiao_ble//zmk board's built-in voltage-divider
# sensor). CONFIG_ZMK_BATTERY_REPORTING is on by default, but is spelled out
# here for clarity. Shortened well below the 60s default: left/right each run
# their own independent, unsynchronized report timer, and the dongle's
# disconnect detection (src/battery_led.c) is only as tight as that interval -
# a shorter interval means less possible skew between when each side's LED
# reports "asleep".
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10

# Manual sleep via the combo in totem.keymap (see &soft_off). Independent of
# CONFIG_ZMK_SLEEP (idle-timeout auto-sleep), which stays off - this only
# happens when you deliberately trigger it.
CONFIG_ZMK_PM_SOFT_OFF=y
