# Applies to all three builds (left/right/dongle share this file - see the
# `id: totem` / `siblings:` fields in totem.zmk.yml, which is what tells
# ZMK's build to use config/totem.conf and config/totem.keymap for every
# sibling shield rather than needing a separate .conf per shield).

# Boosted radio TX power and ZMK's newer BLE connection-handling code path,
# for better split link range/reliability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Central-side battery fetching is only meaningful on the dongle (and is
# also set explicitly in totem_dongle.conf), but harmless here since it's
# inert without CONFIG_ZMK_SPLIT_ROLE_CENTRAL. PROXY additionally exposes
# the fetched peripheral battery levels back out over the dongle's own BLE/
# USB battery service, so the host OS's own battery indicator can show
# them too.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
